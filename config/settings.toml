[paths]
steam_exe       = "G:/Steam/steam.exe"
tf2_cfg_dir     = "S:/SteamLibrary/steamapps/common/Team Fortress 2/tf/cfg"
loginusers_vdf  = "G:/Steam/config/loginusers.vdf"
# console.log is derived automatically from tf2_cfg_dir if not set here:
# console_log   = "C:/Program Files (x86)/Steam/steamapps/common/Team Fortress 2/tf/console.log"

[timing]
idle_duration_min            = 65   # minutes per account (min)
idle_duration_max            = 80   # minutes per account (max)
pause_between_accounts_min   = 15   # seconds between accounts (min)
pause_between_accounts_max   = 35   # seconds between accounts (max)
steam_startup_wait           = 60   # seconds to wait for Steam to start
tf2_startup_wait             = 90   # seconds to wait for TF2 to start
steam_warmup_min = 30
steam_warmup_max = 60

[behavior]
shuffle_accounts = true   # randomise account order every run
shuffle_servers  = false   # pick a random idle server each time
mouse_activity   = false   # move mouse during idle sessions

# Item-drop popup dismissal during idle:
# "auto"              = screenshot a small TF2 UI region; click only if it looks like a popup
# "mouse"             = click the configured TF2 client coordinate every check interval
# "off"               = never dismiss drop popups during idle
# "keyboard_fallback" = old Enter/Escape behavior; can interact with server votes
drop_popup_dismiss = "auto"
drop_popup_check_interval_sec = 120
drop_popup_click_x = 400
drop_popup_click_y = 520
drop_popup_detect_region = [220, 120, 360, 360]

[steam_api]
api_key = "your steam api key"
inventory_poll_attempts = 4
inventory_poll_interval_sec = 15
